project:
  type: website
  output-dir: ../docs

website:
  title: "biomAid"
  navbar:
    left:
      - text: "Home"
        href: index.html
      - text: "Vignettes"
        menu:
          - text: "Wald Tests on Fixed-Effect Contrasts"
            href: waldTest.html
          - text: "Multivariate Random Regression"
            href: randomRegress.html
          - text: "Multivariate Fixed-Effects Regression"
            href: fixedRegress.html
          - text: "Extracting and Padding Field Trial Layouts"
            href: padTrial.html
          - text: "Multiple Comparison Criteria"
            href: compare.html
          - text: "BLUP Accuracy in Multi-Environment Trials"
            href: accuracy.html
          - text: "Simulating Multi-Environment Trials"
            href: simTrialData.html
          - text: "Factor Analytic Variance Structures"
            href: faSummary.html
          - text: "Factor Analytic Selection Tools: FAST and iClass"
            href: fastIC.html
    right:
      # Absolute URL: the reference pages are pkgdown output and so are not
      # part of this Quarto project, which cannot resolve them as a local path.
      - text: "Reference"
        href: https://DrJ001.github.io/biomAid/reference/index.html
      - icon: github
        href: https://github.com/DrJ001/biomAid
        aria-label: "biomAid on GitHub"

format:
  html:
    theme: litera
    css: custom.css
    toc: true
    toc-depth: 3
    toc-location: left
    number-sections: false
    smooth-scroll: true
    embed-resources: true
    code-fold: false
    highlight-style: github

execute:
  freeze: auto
